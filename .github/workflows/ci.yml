name: CI

# F04 — run the full backend suite against an ephemeral Testcontainers Postgres+pgvector
# on every push and PR. GitHub's ubuntu runners ship Docker, so the DB-backed integration
# tests (which apply the real Alembic migration to a real pgvector container) actually run
# here rather than skipping. Seams stay on the fakes (PARSER_MODE/EMBEDDER_MODE/LLM_MODE
# all default to fake) — no API keys needed. The opt-in F23 `real_parser`-marked test is
# excluded explicitly (it would also self-skip from missing OPENROUTER_API_KEY/REAL_PDF_PATH).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The Ryuk reaper sidecar flakes on some hosts; each fixture stops its own container.
      # Carried from tests/conftest.py per the F02 gotcha.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend (dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest, real pgvector via Testcontainers)
        run: pytest -q -m "not real_parser"

  frontend:
    # F51 — the SPA's first real data-fetching feature, and so its first test suite
    # (Vitest+RTL). Tests mock the typed API client only, never a real backend, so this
    # job needs no Postgres/Docker — fully offline, independent of the `test` job above.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Test (vitest)
        run: npm run test

      - name: Build (tsc + vite)
        run: npm run build
