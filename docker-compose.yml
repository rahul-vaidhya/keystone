# Local infra for Keystone: Postgres+pgvector and Redis (arq queue).
# Usage: docker compose up -d   (from repo root)

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: veratas
      POSTGRES_PASSWORD: veratas
      POSTGRES_DB: veratas
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veratas -d veratas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local real-mode reranker (V2, `RealReranker` seam). ONLY needed when running the
  # backend with RERANKER_MODE=real locally — has no effect on CI/offline tests, which
  # stay on RERANKER_ENABLED=False by default and never call this. Point
  # RERANKER_URL=http://localhost:8081 at it once running. Not started by `docker compose
  # up -d` alone if you only need Postgres+Redis — run
  # `docker compose up -d reranker` explicitly, or add it to your default profile.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    ports:
      - "8081:80"

volumes:
  pgdata:
