# Local infra for Veratas: Postgres+pgvector and Redis (arq queue).
# Usage: docker compose up -d   (from repo root)

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: veratas
      POSTGRES_PASSWORD: veratas
      POSTGRES_DB: veratas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veratas -d veratas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
