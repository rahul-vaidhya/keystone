[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veratas-backend"
version = "0.0.0"
description = "Veratas — source-grounded company knowledge base (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "arq>=0.26",
  "redis>=5.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
# Production "real" seam adapters (OpenAI-compatible Embedder/LLM). Not needed for the
# fake-default test suite or CI — install with `pip install .[real]` to use SEAMS_MODE=real.
real = [
  "openai>=1.40",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "testcontainers[postgres]>=4.5",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
