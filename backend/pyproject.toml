[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veratas-backend"
version = "0.0.0"
description = "Veratas — source-grounded company knowledge base (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "arq>=0.26",
  "redis>=5.0",
  "structlog>=24.1",
  "PyJWT>=2.8",
  "argon2-cffi>=23.1",
  "email-validator>=2.1",
  "boto3>=1.34",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Production "real" seam adapters. Not needed for the fake-default test suite or CI —
# install with `pip install .[real]` to use PARSER_MODE/EMBEDDER_MODE/LLM_MODE=real.
# openai: RealEmbedder/RealLLM (OpenAI-compatible API). pypdf: RealParser's local page
# count + encrypted-PDF detection (F23) — httpx itself is a core dep (used by both
# RealParser and the test client).
real = [
  "openai>=1.40",
  "pypdf>=4.0",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "testcontainers[postgres]>=4.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "real_parser: opt-in F23 integration test against the real OpenRouter parser; needs OPENROUTER_API_KEY + REAL_PDF_PATH, excluded from CI.",
]
